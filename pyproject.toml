[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uamfst"
version = "0.1.0"
description = "Uncertainty-aware multimodal few-shot transfer for musculoskeletal injury diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "multimodal large language models",
    "uncertainty quantification",
    "few-shot learning",
    "conformal prediction",
    "musculoskeletal injury",
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "gin-config>=0.5.0",
    "absl-py>=1.4",
    "scikit-learn>=1.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
backbones = ["transformers==4.36.0", "peft>=0.7", "open_clip_torch>=2.20"]
export = ["onnx>=1.15", "onnxscript>=0.1"]
dev = ["pytest>=7.4", "ruff>=0.5", "black>=24.1", "isort>=5.13", "mypy>=1.8", "pre-commit>=3.5"]

[project.scripts]
uamfst-train = "uamfst.cellarmaster.vintage:entry"
uamfst-evaluate = "uamfst.cellarmaster.scoring:entry"
uamfst-infer = "uamfst.cellarmaster.pour:entry"
uamfst-export = "uamfst.cellarmaster.label:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uamfst = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RET", "PIE"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
files = ["src/uamfst"]

[[tool.mypy.overrides]]
module = ["gin.*", "sklearn.*", "scipy.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
